<!doctype html>
<!-- SailZone landing page (served at / by apps/server with npm run build:app).
     Lists the server's rooms from /api/rooms every 5 s; Join opens the game
     at /play/?room=<id>, which connects to this origin's WebSocket.
     Per-room frame-time graphs from /api/perf (last ~180 s, physics + field)
     drawn as SVG polylines (same technique as boat stats) with hover readout.
     Each room card also shows the current room TOML config from /api/rooms
     (refreshed with the room list). When the server has ADMIN_SECRET set,
     a Login button unlocks editable Commit / Reset (Bearer secret remembered
     in localStorage for this origin — never baked into the client bundle);
     Logout clears it. Pre-login the textarea stays visible but read-only.
     ?api=https://host points it at another server (CORS is open). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SailZone</title>
<link rel="icon" href="sailzone-icon.svg" type="image/svg+xml">
<style>
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; background: #f4f7fb; color: #12233a; display: flex; justify-content: center; }
  main { width: min(560px, 94vw); padding: 32px 0; text-align: center; }
  main > img { width: 220px; max-width: 70%; }
  h1 { font-size: 1.6em; margin: 8px 0 24px; }
  ul { list-style: none; padding: 0; margin: 0; text-align: left; }
  li.room { background: #fff; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 4px #0002; }
  li.room .row { display: flex; align-items: center; gap: 12px; }
  li.room .name { font-weight: 600; flex: 1; }
  li.room .count { color: #567; }
  a.join { background: #1565c0; color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; }
  .perf { margin-top: 10px; }
  .perf .meta { font-size: 12px; color: #567; margin: 0 0 4px; display: flex; justify-content: space-between; }
  .perf-chart-wrap { position: relative; color: #12233a; }
  .perf-chart { width: 100%; height: 72px; display: block; border-radius: 6px; }
  .perf-tip {
    position: fixed; left: 0; top: 0; transform: translate(-50%, calc(-100% - 4px));
    pointer-events: none; opacity: 0; z-index: 10000;
    background: #12233a; color: #fff; border-radius: 4px; padding: 3px 7px;
    font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .perf-tip.on { opacity: 1; }
  .room-config-wrap { margin-top: 10px; }
  .room-config {
    display: block; width: 100%; box-sizing: border-box;
    margin: 0; padding: 10px 12px; text-align: left;
    background: #f0f4fa; border: 1px solid #d5deea; border-radius: 6px; color: #12233a;
    font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre; overflow-x: auto; max-height: 280px; overflow-y: auto;
    resize: vertical; min-height: 120px;
  }
  .room-config:read-only { background: #f0f4fa; color: #12233a; }
  .room-config-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .room-config-actions[hidden] { display: none; }
  .room-config-actions button {
    font: 600 13px/1.2 system-ui, sans-serif; padding: 6px 12px; border-radius: 6px;
    border: 1px solid #1565c0; background: #1565c0; color: #fff; cursor: pointer;
  }
  .room-config-actions button.secondary { background: #fff; color: #1565c0; }
  .room-config-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
  .room-config-status { font-size: 12px; color: #a33; flex: 1; min-width: 8em; }
  .room-config-status.ok { color: #2a6; }
  .room-config-hint { font-size: 11px; color: #8a96a8; margin: 6px 0 0; }
  #msg { color: #a33; min-height: 1.4em; }
  footer { margin-top: 28px; font-size: 12px; color: #8a96a8; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <img src="sailzone-logo.svg" alt="">
  <h1>SailZone</h1>
  <ul id="rooms"></ul>
  <p id="msg">Loading rooms…</p>
  <footer>__BUILD_FOOTER__</footer>
</main>
<script src="perf-charts.js"></script>
<script src="room-admin.js"></script>
<script>
  const api = (new URLSearchParams(location.search).get('api') || '').replace(/\/$/, '');
  const list = document.getElementById('rooms');
  const msg = document.getElementById('msg');
  const charts = new Map(); // id → createPerfChart result
  const SECRET_KEY = 'sailzone.adminSecret';

  function ensureChart(id) {
    let c = charts.get(id);
    if (c) return c;
    c = window.LandingPerfCharts.createPerfChart(id);
    charts.set(id, c);
    return c;
  }

  function getSecret() {
    try { return localStorage.getItem(SECRET_KEY) || ''; } catch (_) { return ''; }
  }
  function setSecret(v) {
    try {
      if (v) localStorage.setItem(SECRET_KEY, v);
      else localStorage.removeItem(SECRET_KEY);
    } catch (_) { /* private mode */ }
  }
  function isLoggedIn() { return !!getSecret(); }

  function promptAndStoreSecret() {
    const s = window.prompt('Admin secret (ADMIN_SECRET). Stored in localStorage for this site only.');
    if (s == null) return '';
    const trimmed = String(s).trim();
    if (trimmed) setSecret(trimmed);
    return trimmed;
  }

  function setStatus(li, text, ok) {
    const el = li.querySelector('.room-config-status');
    if (!el) return;
    el.textContent = text || '';
    el.classList.toggle('ok', !!ok);
  }

  function isDirty(li) { return li.dataset.dirty === '1'; }
  function markDirty(li, on) {
    if (on) li.dataset.dirty = '1';
    else delete li.dataset.dirty;
  }

  /** Sync textarea + Login/Logout/Commit/Reset from room.admin and localStorage secret. */
  function bindConfigEditors(li, room) {
    const ta = li.querySelector('textarea.room-config');
    const actions = li.querySelector('.room-config-actions');
    const hint = li.querySelector('.room-config-hint');
    const btnLogin = li.querySelector('button.login');
    const btnLogout = li.querySelector('button.logout');
    const btnCommit = li.querySelector('button.commit');
    const btnReset = li.querySelector('button.reset');
    const admin = !!room.admin;
    const loggedIn = admin && isLoggedIn();
    if (ta) {
      ta.readOnly = !loggedIn;
      // Only overwrite when refreshRooms supplied a string; auth-only rebinds pass no config.
      if (!isDirty(li) && document.activeElement !== ta && typeof room.config === 'string') {
        ta.value = room.config;
      }
    }
    if (actions) actions.hidden = !admin;
    if (btnLogin) btnLogin.hidden = !admin || loggedIn;
    if (btnLogout) btnLogout.hidden = !loggedIn;
    if (btnCommit) btnCommit.hidden = !loggedIn;
    if (btnReset) btnReset.hidden = !loggedIn;
    if (hint) {
      if (!admin) {
        hint.hidden = false;
        hint.textContent = 'Admin editing disabled (server has no ADMIN_SECRET).';
      } else if (!loggedIn) {
        hint.hidden = false;
        hint.textContent = 'Read-only until you log in with ADMIN_SECRET.';
      } else {
        hint.hidden = true;
        hint.textContent = '';
      }
    }
  }

  function buildRoomCard(room) {
    const li = document.createElement('li');
    li.className = 'room';
    li.dataset.id = room.id;
    const row = document.createElement('div'); row.className = 'row';
    const name = document.createElement('span'); name.className = 'name'; name.textContent = room.id;
    const count = document.createElement('span'); count.className = 'count';
    const join = document.createElement('a'); join.className = 'join'; join.textContent = 'Join room';
    join.href = api + '/play/?room=' + encodeURIComponent(room.id);
    row.append(name, count, join);
    const perf = document.createElement('div'); perf.className = 'perf';
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.innerHTML = '<span>Frame time (physics + field)</span><span class="latest">—</span>';
    const chart = ensureChart(room.id);
    perf.append(meta, chart.el);
    const wrap = document.createElement('div'); wrap.className = 'room-config-wrap';
    const ta = document.createElement('textarea');
    ta.className = 'room-config';
    ta.spellcheck = false;
    ta.setAttribute('autocomplete', 'off');
    ta.rows = 14;
    ta.addEventListener('input', () => { markDirty(li, true); setStatus(li, ''); });
    const actions = document.createElement('div'); actions.className = 'room-config-actions';
    const login = document.createElement('button'); login.type = 'button'; login.textContent = 'Login'; login.className = 'login secondary';
    const logout = document.createElement('button'); logout.type = 'button'; logout.textContent = 'Logout'; logout.className = 'logout secondary';
    const commit = document.createElement('button'); commit.type = 'button'; commit.textContent = 'Commit'; commit.className = 'commit';
    const reset = document.createElement('button'); reset.type = 'button'; reset.textContent = 'Reset'; reset.className = 'reset secondary';
    const status = document.createElement('span'); status.className = 'room-config-status';
    actions.append(login, logout, commit, reset, status);
    const hint = document.createElement('p'); hint.className = 'room-config-hint';
    wrap.append(ta, actions, hint);
    li.append(row, perf, wrap);

    login.addEventListener('click', () => {
      const secret = promptAndStoreSecret();
      if (!secret) { setStatus(li, 'Admin secret required.'); return; }
      setStatus(li, '');
      // Re-bind all cards so Commit/Reset appear everywhere after one Login.
      for (const card of list.querySelectorAll('li.room')) {
        bindConfigEditors(card, { id: card.dataset.id, admin: card.dataset.admin === '1', config: null });
      }
    });

    logout.addEventListener('click', () => {
      setSecret('');
      setStatus(li, '');
      for (const card of list.querySelectorAll('li.room')) {
        markDirty(card, false);
        // No config: keep current textarea text; next refreshRooms syncs from server.
        bindConfigEditors(card, { id: card.dataset.id, admin: card.dataset.admin === '1' });
      }
    });

    commit.addEventListener('click', async () => {
      const secret = getSecret();
      if (!secret) {
        setStatus(li, 'Log in first.');
        for (const card of list.querySelectorAll('li.room')) {
          bindConfigEditors(card, { id: card.dataset.id, admin: card.dataset.admin === '1', config: null });
        }
        return;
      }
      commit.disabled = true;
      setStatus(li, 'Applying…');
      try {
        const r = await fetch(api + '/api/rooms/' + encodeURIComponent(room.id) + '/config', {
          method: 'PUT',
          headers: {
            'content-type': 'text/plain; charset=utf-8',
            'authorization': 'Bearer ' + secret,
          },
          body: ta.value,
          cache: 'no-store',
        });
        const body = await r.json().catch(() => ({}));
        if (r.status === 401) {
          setSecret('');
          setStatus(li, body.error || 'Unauthorized — secret cleared; log in again.');
          for (const card of list.querySelectorAll('li.room')) {
            bindConfigEditors(card, { id: card.dataset.id, admin: card.dataset.admin === '1', config: null });
          }
          return;
        }
        if (!r.ok) {
          setStatus(li, body.error || ('HTTP ' + r.status));
          return;
        }
        if (typeof body.config === 'string') ta.value = body.config;
        markDirty(li, false);
        setStatus(li, 'Applied.', true);
      } catch (e) {
        setStatus(li, e.message || 'request failed');
      } finally {
        commit.disabled = false;
      }
    });

    reset.addEventListener('click', () => {
      const dims = window.LandingRoomAdmin.mapDimsFromToml(ta.value);
      const mapW = Number.isFinite(dims.mapW) ? dims.mapW : undefined;
      const mapH = Number.isFinite(dims.mapH) ? dims.mapH : undefined;
      ta.value = window.LandingRoomAdmin.defaultToml(mapW, mapH);
      markDirty(li, true);
      setStatus(li, '');
    });

    updateRoomCard(li, room);
    return li;
  }

  function updateRoomCard(li, room) {
    li.dataset.admin = room.admin ? '1' : '0';
    const count = li.querySelector('.count');
    if (count) count.textContent = room.players + (room.players === 1 ? ' player' : ' players');
    const join = li.querySelector('a.join');
    if (join) join.href = api + '/play/?room=' + encodeURIComponent(room.id);
    bindConfigEditors(li, room);
  }

  async function refreshRooms() {
    try {
      const r = await fetch(api + '/api/rooms', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const rooms = await r.json();
      const keep = new Set(rooms.map((x) => x.id));
      for (const id of [...charts.keys()]) {
        if (!keep.has(id)) { charts.get(id).destroy(); charts.delete(id); }
      }
      for (const el of [...list.querySelectorAll('li.room')]) {
        if (!keep.has(el.dataset.id)) el.remove();
      }
      const byId = new Map([...list.querySelectorAll('li.room')].map((el) => [el.dataset.id, el]));
      const next = [];
      for (const room of rooms) {
        let li = byId.get(room.id);
        if (!li) li = buildRoomCard(room);
        else updateRoomCard(li, room);
        next.push(li);
      }
      list.replaceChildren(...next);
      msg.textContent = rooms.length ? '' : 'No rooms.';
    } catch (e) {
      msg.textContent = 'Server unreachable (' + e.message + ').';
    }
  }

  async function refreshPerf() {
    try {
      const r = await fetch(api + '/api/perf', { cache: 'no-store' });
      if (!r.ok) return;
      const body = await r.json();
      for (const room of body.rooms || []) {
        const li = list.querySelector('li.room[data-id="' + CSS.escape(room.id) + '"]');
        const chart = charts.get(room.id);
        if (!chart) continue;
        chart.draw(room);
        if (li) {
          const latest = li.querySelector('.latest');
          if (latest) latest.textContent = room.latestMs != null ? room.latestMs.toFixed(1) + ' ms' : 'idle';
        }
      }
    } catch (_) { /* rooms refresh shows errors */ }
  }

  refreshRooms().then(refreshPerf);
  setInterval(refreshRooms, 5000);
  setInterval(refreshPerf, 2000);
</script>
</body>
</html>
