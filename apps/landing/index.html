<!doctype html>
<!-- SailZone landing page (served at / by apps/server with npm run build:app).
     Lists the server's rooms from /api/rooms every 5 s; Join opens the game
     at /play/?room=<id>, which connects to this origin's WebSocket.
     Per-room frame-time graphs from /api/perf (last ~180 s, physics + field).
     Hover a graph to read ms at that sample (and how long ago).
     ?api=https://host points it at another server (CORS is open). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SailZone</title>
<link rel="icon" href="sailzone-icon.svg" type="image/svg+xml">
<style>
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; background: #f4f7fb; color: #12233a; display: flex; justify-content: center; }
  main { width: min(520px, 94vw); padding: 32px 0; text-align: center; }
  main > img { width: 220px; max-width: 70%; }
  h1 { font-size: 1.6em; margin: 8px 0 24px; }
  ul { list-style: none; padding: 0; margin: 0; text-align: left; }
  li.room { background: #fff; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 4px #0002; }
  li.room .row { display: flex; align-items: center; gap: 12px; }
  li.room .name { font-weight: 600; flex: 1; }
  li.room .count { color: #567; }
  a.join { background: #1565c0; color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; }
  .perf { margin-top: 10px; position: relative; }
  .perf .meta { font-size: 12px; color: #567; margin: 0 0 4px; display: flex; justify-content: space-between; }
  .perf canvas { width: 100%; height: 72px; display: block; background: #f0f4fa; border-radius: 6px; cursor: crosshair; }
  .perf .tip {
    display: none; position: absolute; z-index: 2; pointer-events: none;
    background: #12233a; color: #fff; font-size: 11px; line-height: 1.3;
    padding: 4px 7px; border-radius: 4px; white-space: nowrap;
    transform: translate(-50%, calc(-100% - 8px));
  }
  .perf .tip.on { display: block; }
  #msg { color: #a33; min-height: 1.4em; }
  footer { margin-top: 28px; font-size: 12px; color: #8a96a8; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <img src="sailzone-logo.svg" alt="">
  <h1>SailZone</h1>
  <ul id="rooms"></ul>
  <p id="msg">Loading rooms…</p>
  <footer>__BUILD_FOOTER__</footer>
</main>
<script>
  const api = (new URLSearchParams(location.search).get('api') || '').replace(/\/$/, '');
  const list = document.getElementById('rooms');
  const msg = document.getElementById('msg');
  // id → { canvas, ctx, tip, room, hover }
  const charts = new Map();

  function ensureChart(id) {
    let c = charts.get(id);
    if (c) return c;
    const canvas = document.createElement('canvas');
    canvas.width = 480; canvas.height = 72;
    canvas.setAttribute('aria-label', id + ' frame time');
    const tip = document.createElement('div');
    tip.className = 'tip';
    tip.setAttribute('role', 'tooltip');
    c = { canvas, ctx: canvas.getContext('2d'), tip, room: null, hover: -1 };
    canvas.addEventListener('mousemove', (e) => onHover(c, e));
    canvas.addEventListener('mouseleave', () => {
      c.hover = -1;
      c.tip.classList.remove('on');
      if (c.room) drawPerf(c);
    });
    charts.set(id, c);
    return c;
  }

  function sampleIndex(c, clientX) {
    const times = (c.room && c.room.times) || [];
    if (times.length < 1) return -1;
    const rect = c.canvas.getBoundingClientRect();
    const x = ((clientX - rect.left) / rect.width) * c.canvas.width;
    if (times.length === 1) return 0;
    const i = Math.round((x / (c.canvas.width - 1)) * (times.length - 1));
    return Math.max(0, Math.min(times.length - 1, i));
  }

  function agoLabel(room, i) {
    const n = room.times.length;
    const hz = room.sampleHz || 30;
    const ageS = (n - 1 - i) / hz;
    if (ageS < 0.05) return 'now';
    if (ageS < 1) return ageS.toFixed(2) + 's ago';
    if (ageS < 60) return ageS.toFixed(1) + 's ago';
    return (ageS / 60).toFixed(1) + 'm ago';
  }

  function onHover(c, e) {
    if (!c.room) return;
    const i = sampleIndex(c, e.clientX);
    if (i < 0) { c.tip.classList.remove('on'); return; }
    c.hover = i;
    const ms = c.room.times[i];
    c.tip.textContent = ms.toFixed(1) + ' ms · ' + agoLabel(c.room, i);
    const rect = c.canvas.getBoundingClientRect();
    const perf = c.canvas.parentElement;
    const x = e.clientX - rect.left;
    // tip is positioned relative to .perf; canvas sits below .meta
    c.tip.style.left = (c.canvas.offsetLeft + x) + 'px';
    c.tip.style.top = c.canvas.offsetTop + 'px';
    c.tip.classList.add('on');
    drawPerf(c);
  }

  function drawPerf(c) {
    const canvas = c.canvas, ctx = c.ctx, room = c.room;
    if (!room) return;
    const w = canvas.width, h = canvas.height;
    const times = room.times || [];
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#f0f4fa';
    ctx.fillRect(0, 0, w, h);
    // Budget line at 33.3 ms (30 Hz slot)
    const budget = 1000 / 30;
    const maxY = Math.max(budget * 1.2, ...times, 1);
    const yOf = (ms) => h - 4 - (ms / maxY) * (h - 12);
    ctx.strokeStyle = '#c5d0de';
    ctx.lineWidth = 1;
    ctx.beginPath();
    const yb = yOf(budget);
    ctx.moveTo(0, yb); ctx.lineTo(w, yb); ctx.stroke();
    if (times.length < 2) {
      ctx.fillStyle = '#8a96a8';
      ctx.font = '11px system-ui,sans-serif';
      ctx.fillText(times.length ? '1 sample' : 'No samples yet (room idle)', 8, h / 2 + 4);
      if (c.hover === 0 && times.length === 1) {
        const y = yOf(times[0]);
        ctx.fillStyle = '#1565c0';
        ctx.beginPath(); ctx.arc(w / 2, y, 3, 0, Math.PI * 2); ctx.fill();
      }
      return;
    }
    ctx.strokeStyle = '#1565c0';
    ctx.lineWidth = 1.25;
    ctx.beginPath();
    for (let i = 0; i < times.length; i++) {
      const x = (i / (times.length - 1)) * (w - 1);
      const y = yOf(times[i]);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    if (c.hover >= 0 && c.hover < times.length) {
      const x = (c.hover / (times.length - 1)) * (w - 1);
      const y = yOf(times[c.hover]);
      ctx.strokeStyle = '#12233a88';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, 4); ctx.lineTo(x, h - 4); ctx.stroke();
      ctx.fillStyle = '#1565c0';
      ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.fillStyle = '#8a96a8';
    ctx.font = '10px system-ui,sans-serif';
    ctx.fillText(Math.round(maxY) + ' ms', 4, 12);
    ctx.fillText('0', 4, h - 4);
    ctx.fillText('−' + (room.windowS || 180) + 's', w - 36, h - 4);
  }

  async function refreshRooms() {
    try {
      const r = await fetch(api + '/api/rooms', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const rooms = await r.json();
      const keep = new Set(rooms.map((x) => x.id));
      for (const id of [...charts.keys()]) if (!keep.has(id)) charts.delete(id);
      list.replaceChildren(...rooms.map((room) => {
        const li = document.createElement('li');
        li.className = 'room';
        li.dataset.id = room.id;
        const row = document.createElement('div'); row.className = 'row';
        const name = document.createElement('span'); name.className = 'name'; name.textContent = room.id;
        const count = document.createElement('span'); count.className = 'count';
        count.textContent = room.players + (room.players === 1 ? ' player' : ' players');
        const join = document.createElement('a'); join.className = 'join'; join.textContent = 'Join room';
        join.href = api + '/play/?room=' + encodeURIComponent(room.id);
        row.append(name, count, join);
        const perf = document.createElement('div'); perf.className = 'perf';
        const meta = document.createElement('div'); meta.className = 'meta';
        meta.innerHTML = '<span>Frame time (physics + field)</span><span class="latest">—</span>';
        const chart = ensureChart(room.id);
        perf.append(meta, chart.canvas, chart.tip);
        li.append(row, perf);
        return li;
      }));
      msg.textContent = rooms.length ? '' : 'No rooms.';
    } catch (e) {
      msg.textContent = 'Server unreachable (' + e.message + ').';
    }
  }

  async function refreshPerf() {
    try {
      const r = await fetch(api + '/api/perf', { cache: 'no-store' });
      if (!r.ok) return;
      const body = await r.json();
      for (const room of body.rooms || []) {
        const li = list.querySelector('li.room[data-id="' + CSS.escape(room.id) + '"]');
        const chart = charts.get(room.id);
        if (!chart) continue;
        // Keep hover index if still in range after refresh.
        const prev = chart.hover;
        chart.room = room;
        if (prev >= (room.times || []).length) chart.hover = -1;
        drawPerf(chart);
        if (li) {
          const latest = li.querySelector('.latest');
          if (latest) latest.textContent = room.latestMs != null ? room.latestMs.toFixed(1) + ' ms' : 'idle';
        }
      }
    } catch (_) { /* rooms refresh shows errors */ }
  }

  refreshRooms().then(refreshPerf);
  setInterval(refreshRooms, 5000);
  setInterval(refreshPerf, 2000);
</script>
</body>
</html>
