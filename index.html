<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:,">
    <title>New webpage</title>
  
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
      }

#info {
        position: absolute;
        top: 10px;
        left: 368px;
        right: 270px;
        width: auto;
        color: white;
        z-index: 100;
        display:block;
        font-family: 'Courier New', Courier, monospace;
        pointer-events: none;
      }
      #scenario_card {
        position: absolute;
        top: 10px;
        left: 10px;
        width: min(340px, calc(100vw - 280px));
        max-height: 42vh;
        overflow: auto;
        z-index: 120;
        color: #f4f7fb;
        font-family: 'Courier New', Courier, monospace;
        font-size: 13px;
        line-height: 1.45;
        background: rgba(12, 18, 28, 0.9);
        border: 1px solid rgba(180, 200, 220, 0.45);
        border-radius: 6px;
        padding: 8px 10px 10px;
      }
      #scenario_card_head {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      #scenario_card_num {
        flex: none;
        font-weight: 700;
        color: #9ef;
      }
      #scenario_card_title {
        flex: 1;
        font-weight: 700;
      }
      #scenario_card_toggle {
        flex: none;
        font-family: inherit;
        font-size: 11px;
        color: #cde;
        background: transparent;
        border: 1px solid rgba(180, 200, 220, 0.5);
        border-radius: 3px;
        padding: 1px 6px;
        cursor: pointer;
      }
      #scenario_card_body {
        margin: 8px 0 0;
      }
      #scenario_card.collapsed #scenario_card_body {
        display: none;
      }      
      #settings {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 250px;
        color: white;
        z-index: 100;
        display:block;
        font-family: 'Courier New', Courier, monospace;
        background-color: rgba(50,50,50,0.5);
      }
      #devmode_banner {
        display: none;
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        color: #9ef;
        font-family: 'Courier New', Courier, monospace;
        background: rgba(10, 30, 40, 0.8);
        border: 1px solid #49c;
        padding: 6px 12px;
        pointer-events: none;
        text-align: center;
        white-space: nowrap;
      }
      #dev_wind_arrow {
        display: inline-block;
        margin-left: 8px;
      }
      #rule_labels {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 80;
        overflow: hidden;
      }
      .rule-label {
        position: absolute;
        transform: translate(-50%, -150%);
        color: #fff;
        background: rgba(0, 0, 0, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 3px;
        padding: 2px 7px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.03em;
        white-space: nowrap;
      }
      .rule-label-15 {
        color: #ffe7a3;
        background: rgba(40, 28, 0, 0.9);
        border-color: #ffc240;
        padding-bottom: 5px;
      }
      .rule15-track {
        margin-top: 4px;
        height: 8px;
        width: 100%;
        min-width: 168px;
        background: rgba(255, 255, 255, 0.22);
        border-radius: 4px;
        overflow: hidden;
      }
      .rule15-fill {
        height: 100%;
        width: 100%;
        background: #ffc240;
        transform-origin: left center;
      }

    </style>
  
  </head>
  <body>

    <div id="scenario_card">
      <div id="scenario_card_head">
        <span id="scenario_card_num"></span>
        <span id="scenario_card_title"></span>
        <button id="scenario_card_toggle" type="button" aria-expanded="true" title="Hide or show the scenario description">Hide</button>
      </div>
      <p id="scenario_card_body"></p>
    </div>
    <div id="info"></div>
    <div id="rule_labels"></div>
    <div id="devmode_banner" title="The angle is where the wind comes from. The arrow points downwind, the way it blows.">DEV MODE · fluid off · wind <span id="dev_wind_label"></span><span id="dev_wind_arrow">➤</span></div>
    <div id="fps" style="position:absolute; bottom:10px; left:10px; color:white; font-family:'Courier New',monospace; z-index:100;"></div>
    <div id="settings">
      <input id="devmode" autocomplete="off" type="checkbox" title="Constant wind, no fluid simulation. Also enabled by ?devmode=1">Dev mode
      <br>
      <input id="amr" autocomplete="off" type="checkbox" checked>Mesh refinement
      <br>
      <input id="barrier" autocomplete="off" type="checkbox" title="Circular obstacle at the map centre. Off by default. Check it and set wind speed to about 25 to shed waves that refine on their own, away from the boat.">Barrier
      <br>
      <input id="boat_energy" autocomplete="off" type="checkbox" checked>Boat energy
      <br>
      <input id="show_field" autocomplete="off" type="checkbox">Toggle Field
      <br>
      <input id="show_forces" autocomplete="off" type="checkbox">Toggle Forces
      <br>
      <input id="camera_follow" autocomplete="off" type="checkbox">Camera Follow
      <br>
      <input id="camera_zoom_in" type="button" value="+"><input id="camera_zoom_out" type="button" value="-">Zoom
      <br>
      <input id="camera_move_left" type="button" value="◄">
      <input id="camera_move_right" type="button" value="►">
      <input id="camera_move_up" type="button" value="▲">
      <input id="camera_move_down" type="button" value="▼">
      <br>
      Wind angle<br>
      <input id="windAngle" autocomplete="off" type="number" min="0" max="360" step="5" value="90">
      <br>
      Wind speed<br>
      <input id="windSpeed" autocomplete="off" type="number" min="0" max="40" step="1" value="15">
      <br>
      Select Scenario<br>
      <input id="scenario_selector" autocomplete="off" type="number" min="0" max="12" value="0" style="width: 50px;" title="Scenario 6: Rule 13 tack. Scenario 7: leeward boat tacks into a Rule 10 collision. Scenario 8: Rule 15 overlap. Scenario 9: contact during Rule 15. Scenario 10: penalty turn, a tack and a gybe in a row (Q counter-clockwise, E clockwise autopilot circle). Scenario 11: anchored mark buoy, boat hits it. Scenario 12: anticlockwise triangle course, marks to port, next mark and check angle shown. Use with Dev mode.">
      
      <input id="scenario_restart" type="button" min="0" max="10" style="width: 50px;" value="Restart">
    
      <div id="wind_info"></div>
      <div style="color:red;" id="dist_info"></div>



      <div>
        <select id="plotSelect" autocomplete="off">
          <option>Plot density</option>
          <option>Plot x velocity</option>
          <option>Plot y velocity</option>
          <option selected="selected">Plot speed</option>
          <option>Plot curl</option>
        </select>
        &nbsp;&nbsp;Contrast:
        <input id="contrastSlider" autocomplete="off" type="range" min="-10" max="10" step="1" value="0">
        &nbsp;&nbsp;Mirror:
        <input id="mirrorSlider" autocomplete="off" type="range" min="0" max="359" step="1" value="0">
      </div>
      <div>
        Animation speed:
        <input id="stepsSlider" autocomplete="off" type="range" min="1" max="40" step="1" value="1" onchange="resetTimer()">
        &nbsp;&nbsp;Steps per second: <span id="speedReadout">60</span>
        &nbsp;&nbsp;<input id="rafCheck" autocomplete="off" type="checkbox" onchange="resetTimer()">Faster?
      </div>
      <br>
      <input id="reset_settings" type="button" value="Reset settings">

    </div>

    <script type="module" src="./src/main.js"></script>

    
  </body>
</html>
